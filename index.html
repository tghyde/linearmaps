<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linear Map Visualizer</title>
<meta name="description" content="See what a matrix does to the plane: figures, lattices, and circles under a linear transformation.">

<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js"></script>
<style>
/* Theme copied from hwGenie's "slate" theme (shared with the Row Reducer). */
:root {
  --bg: #faf9f6;
  --fg: #20242a;
  --muted: #5d646f;
  --accent: #24589f;
  --alert: #b3223a;
  --border: #dcdad0;
  --card-bg: #efeee8;
  --sol-bg: #e6efe6;
  --sol-accent: #2c6a3f;
  --code-bg: #f1f0ea;
  --hover-bg: #e2e8f3;
  --uvec: #c0392b;
  --vvec: #2b64c4;
  --wvec: #2e8b57;
  --sph2: #d98e04;
  --font-body: Charter, "Bitstream Charter", Georgia, "Times New Roman", serif;
  --font-ui: system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171c;
    --fg: #e7e5e0;
    --muted: #9aa1ad;
    --accent: #8db1ea;
    --alert: #e87a90;
    --border: #33363e;
    --card-bg: #1f222a;
    --sol-bg: #1c2721;
    --sol-accent: #98cda5;
    --code-bg: #22252d;
    --hover-bg: #2b3242;
    --uvec: #e5756a;
    --vvec: #7ea6ef;
    --wvec: #6fcf97;
    --sph2: #f0b547;
  }
}
:root[data-theme="dark"] {
  --bg: #15171c;
  --fg: #e7e5e0;
  --muted: #9aa1ad;
  --accent: #8db1ea;
  --alert: #e87a90;
  --border: #33363e;
  --card-bg: #1f222a;
  --sol-bg: #1c2721;
  --sol-accent: #98cda5;
  --code-bg: #22252d;
  --hover-bg: #2b3242;
  --uvec: #e5756a;
  --vvec: #7ea6ef;
  --wvec: #6fcf97;
  --sph2: #f0b547;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 1.0625rem;
  line-height: 1.65;
}
@media (prefers-reduced-motion: no-preference) {
  body { transition: background-color .2s ease, color .2s ease; }
}
main { max-width: 62rem; margin: 0 auto; padding: .2rem 1.1rem 4rem; }
a { color: var(--accent); }

#themetoggle {
  position: fixed;
  top: .5rem;
  right: .7rem;
  z-index: 60;
  background: var(--card-bg);
  color: var(--fg);
  border: none;
  padding: .3rem .6rem;
  font-size: 1rem;
  line-height: 1;
  cursor: pointer;
}
#themetoggle:hover { background: var(--code-bg); }

#courselink {
  position: fixed;
  top: .5rem;
  left: .7rem;
  z-index: 60;
  background: var(--card-bg);
  color: var(--accent);
  text-decoration: none;
  padding: .3rem .6rem;
  font-family: var(--font-ui);
  font-size: .85rem;
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
}
#courselink:hover { background: var(--accent); color: var(--bg); }

/* Hero banner, as on the hwGenie course page: the title floats in a
   borderless card over the banner art. */
.hero {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  max-width: 62rem;
  margin: 0 auto;
  min-height: 11rem;
  padding: 2.5rem 1.1rem;
}
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero header.doc {
  position: relative;
  text-align: center;
  margin: 0;
  max-width: min(100%, 38rem);
  padding: 1.2rem 2rem;
  background: var(--card-bg);
}
header.doc h1 { font-size: 1.7rem; line-height: 1.25; margin: 0; font-weight: 700; }

.panel { background: var(--card-bg); padding: .7rem 1.2rem .75rem; margin: .9rem 0; }
.cardhead { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .7rem; }
.cardhead button.filebox { padding: .3rem .55rem; }
.cardhead .card-title { margin: 0; }
.cardhead .btnrow { margin: 0; margin-left: auto; }
.cardhead .btnrow[hidden] { display: none; }
.card-title {
  font-family: var(--font-ui);
  font-size: .78rem;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 .8rem;
}
p.hint, .hint { font-family: var(--font-ui); font-size: .85rem; color: var(--muted); margin: .2rem 0 .9rem; }
.msg { color: var(--alert); font-family: var(--font-ui); font-size: .8rem; margin: .3rem 0 0; }
.msg:empty { display: none; }

button.filebox {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  background: var(--bg);
  border: none;
  padding: .3rem .7rem;
  font-family: var(--font-ui);
  font-size: .85rem;
  font-weight: 600;
  white-space: nowrap;
  color: var(--accent);
  cursor: pointer;
}
button.filebox:hover { background: var(--accent); color: var(--bg); }
button.filebox:disabled { color: var(--muted); cursor: default; }
button.filebox:disabled:hover { background: var(--bg); }
.btnrow { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1rem; align-items: center; }

select {
  font-family: var(--font-mono);
  font-size: .95rem;
  background: var(--bg);
  color: var(--fg);
  border: 1px solid var(--border);
  padding: .25rem .15rem;
}
select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
label.fld {
  font-family: var(--font-ui);
  font-size: .85rem;
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  gap: .45rem;
}
label.fld input[type="checkbox"] { accent-color: var(--accent); margin: 0; width: .95rem; height: .95rem; }
label.fld.chk { cursor: pointer; color: var(--fg); }
.setuprow { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin: 0; }
.setuprow .hint { margin: 0; }

/* --- matrix panel: entry on the left, example maps on the right --- */
.controls { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr) minmax(0, 1fr); gap: .8rem; margin: .9rem 0; align-items: stretch; }
@media (max-width: 58rem) { .controls { grid-template-columns: 1fr; } }
.controls .panel { margin: 0; display: flex; flex-direction: column; gap: .45rem; }
.controls .btnrow { margin: 0; gap: .45rem; }
.matentry .hint { margin: 0; }
.optrow { gap: .35rem 1rem; }
@media (max-width: 46rem) { .matcols { grid-template-columns: 1fr; } }
.matwrap {
  display: flex;
  justify-content: safe center;
  align-items: stretch;
  overflow-x: auto;
  padding: .1rem 0 .15rem;
}
.bracket { flex: 0 0 .5rem; border: 2px solid var(--fg); }
.bracket.bl { border-right: none; margin-right: .25rem; }
.bracket.br { border-left: none; margin-left: .25rem; }
#grid { display: grid; row-gap: .3rem; column-gap: .5rem; align-content: center; padding: .3rem 0; }
input.cell {
  font-family: var(--font-mono);
  font-size: .95rem;
  text-align: center;
  width: 100%;
  min-width: 3.2rem;
  padding: .3rem .2rem;
  background: var(--bg);
  color: var(--fg);
  border: 1px solid var(--border);
}
input.cell:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
input.cell.bad { outline: 2px solid var(--alert); outline-offset: -1px; }
.texmat { font-size: 1.25rem; text-align: center; overflow-x: auto; padding: .15rem 0 0; }

/* --- the two planes --- */
.views { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem; margin: .9rem 0; }
@media (max-width: 46rem) { .views { grid-template-columns: 1fr; } }
.view { background: var(--card-bg); padding: .9rem 1rem 1rem; }
.viewhead { display: flex; align-items: center; justify-content: space-between; gap: .6rem; margin-bottom: .55rem; }
.viewhead .card-title { margin: 0; }
.zoom { display: inline-flex; gap: .3rem; }
.zoom button.filebox { padding: .15rem .55rem; font-size: .9rem; line-height: 1.2; }
svg.plane {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 1 / 1;
  background: var(--bg);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
svg.plane.dragging { cursor: grabbing; }
.plane .grid { stroke: var(--border); stroke-width: 1; }
.plane .axis { stroke: var(--muted); stroke-width: 1.2; }
.plane .ticklabel { fill: var(--muted); font-family: var(--font-ui); font-size: 9px; }
.plane text { stroke: none; }
.plane .fig { fill: var(--accent); fill-opacity: .22; stroke: var(--accent); stroke-width: 1.6; stroke-linejoin: round; }
.plane .figdetail { fill: var(--accent); stroke: none; }
.plane .figline { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linecap: round; }
.plane .figsolid { fill: var(--accent); fill-opacity: .9; stroke: none; }
.plane .circ { fill: none; stroke: var(--alert); stroke-width: 1.8; }
.plane .circA { fill: var(--alert); fill-opacity: .45; stroke: none; }
.plane .circB { fill: var(--sph2); fill-opacity: .45; stroke: none; }
.plane .sph { fill: none; stroke: var(--fg); stroke-width: .9; stroke-opacity: .3; }
.plane .sphedge { fill: none; stroke: var(--alert); stroke-width: 1.3; }
.plane .sphfill { fill: var(--alert); fill-opacity: .45; stroke: var(--alert); stroke-width: 1.6; }
.plane .axlbl { fill: var(--muted); font-family: var(--font-body); font-style: italic; font-size: 14px; }
.plane .mesh { stroke-linejoin: round; }
svg.plane { cursor: grab; }
svg.plane.dragging { cursor: grabbing; }
.plane .lat { stroke-opacity: .45; stroke-width: 1; }
.plane .lat.lu { stroke: var(--uvec); }
.plane .lat.lv { stroke: var(--vvec); }
.plane .lat.lw { stroke: var(--wvec); }
.plane .latpt { fill: var(--fg); fill-opacity: .8; }
.plane .usq { fill: var(--fg); fill-opacity: .08; stroke: none; }
.plane .usqedge { stroke: var(--fg); stroke-opacity: .4; stroke-width: 1; stroke-linecap: round; }
.plane .uvec { stroke: var(--uvec); fill: var(--uvec); }
.plane .vvec { stroke: var(--vvec); fill: var(--vvec); }
.plane .wvec { stroke: var(--wvec); fill: var(--wvec); }
.plane .basis { stroke: var(--fg); fill: var(--fg); }
.plane .shaft { fill: none; stroke-width: 2; stroke-linecap: round; }
.plane .basis.shaft { stroke-width: 1.6; }
.plane .head { stroke: none; }
.plane .hit { cursor: grab; fill: transparent; stroke: none; pointer-events: all; }
.plane .uvsq { fill: var(--vvec); fill: color-mix(in srgb, var(--uvec), var(--vvec)); fill-opacity: .14; stroke: none; }
#svgDom .figgroup { cursor: move; }
#matTex { cursor: pointer; }
#matTex:hover { background: var(--hover-bg); }
.plane .lbl { font-family: var(--font-body); font-style: italic; font-size: 14px; }
.plane .note { fill: var(--muted); font-family: var(--font-ui); font-size: 13px; }

/* --- options --- */
.optrow { display: flex; flex-wrap: wrap; gap: .5rem 1.4rem; align-items: center; }
.swatch { display: inline-block; width: .8rem; height: .8rem; border-radius: 50%; vertical-align: -1px; }
.swatch.u { background: var(--uvec); }
.swatch.v { background: var(--vvec); }
.swatch.w { background: var(--wvec); }
.swatch[hidden] { display: none; }
#latticeTools { display: flex; flex-wrap: wrap; gap: .3rem .9rem; align-items: center; }
.vecrow { display: flex; flex-wrap: wrap; gap: .15rem .9rem; align-items: center; }
.vec { display: inline-flex; align-items: center; font-size: 1rem; }
.vectex { cursor: pointer; padding: 0 .25rem; }
.vectex:hover { background: var(--hover-bg); }
.vecedit { display: inline-flex; align-items: center; gap: .15rem; font-family: var(--font-body); font-style: italic; }
.vecedit[hidden] { display: none; }
input.cell.vcell { width: 3.2rem; min-width: 0; padding: .2rem .1rem; font-size: .9rem; }
#latticeTools[hidden] { display: none; }
#uvRead { font-size: 1rem; }

footer.doc {
  margin-top: 3.5rem;
  text-align: center;
  font-family: var(--font-ui);
  font-size: .78rem;
  color: var(--muted);
}
</style>

<a id="courselink" href="https://tghyde.github.io/math221-fall2026/" title="Back to the Math 221 course site">&larr; Math 221</a>
<button id="themetoggle" aria-label="Toggle light or dark theme" title="Toggle light/dark"></button>
<div class="hero">
  <img src="banner.png" alt="">
  <header class="doc"><h1>Linear Map Visualizer</h1></header>
</div>
<main>

  <!-- ============ controls: matrix, examples, show ============ -->
  <section class="controls">
    <div class="panel" id="matpanel">
      <div class="cardhead">
        <p class="card-title">Matrix</p>
        <div class="setuprow">
          <label class="fld">m <select id="selM" aria-label="Number of rows m"><option>2</option><option>3</option></select></label>
          <span>&times;</span>
          <label class="fld">n <select id="selN" aria-label="Number of columns n"><option>2</option><option>3</option></select></label>
        </div>
        <div class="btnrow" id="editBtns">
          <button class="filebox" id="mapBtn">Map &rarr;</button>
          <button class="filebox" id="clearBtn">Clear</button>
        </div>
        <div class="btnrow" id="mapBtns" hidden>
          <button class="filebox" id="editBtn">&larr; Edit</button>
          <button class="filebox" id="copyLink">Copy link</button>
        </div>
      </div>
      <div class="matentry">
        <div id="editBox">
          <div class="matwrap">
            <div class="bracket bl" aria-hidden="true"></div>
            <div id="grid"></div>
            <div class="bracket br" aria-hidden="true"></div>
          </div>
          <p class="hint">Entries like <code>-3</code>, <code>1/2</code>, <code>0.25</code>, or <code>sqrt(3)/2</code>.</p>
        </div>
        <div id="mapBox" hidden>
          <div id="matTex" class="texmat" title="Click to edit"></div>
        </div>
        <p class="msg" id="editMsg"></p>
      </div>
    </div>

    <div class="panel" id="examples">
      <p class="card-title" style="margin:0">Examples</p>
      <div class="btnrow">
        <button class="filebox" data-preset="rotation">Rotation</button>
        <button class="filebox" data-preset="dilation">Dilation</button>
        <button class="filebox" data-preset="reflection">Reflection</button>
        <button class="filebox" data-preset="shear">Shear</button>
        <button class="filebox" data-preset="projection">Projection</button>
        <button class="filebox" data-preset="random">Random</button>
      </div>
    </div>

    <div class="panel" id="options">
      <p class="card-title" style="margin:0">Show</p>
      <div class="optrow">
        <label class="fld chk"><input type="checkbox" id="chkFigure" checked> Figure</label>
        <label class="fld chk"><input type="checkbox" id="chkCircle"> <span id="circleLbl">Unit circle</span></label>
        <label class="fld chk"><input type="checkbox" id="chkLattice"> Lattice <span class="swatch u" aria-hidden="true"></span><span class="swatch v" aria-hidden="true"></span><span class="swatch w" id="swW" aria-hidden="true" hidden></span></label>
        <label class="fld chk"><input type="checkbox" id="chkBasis"> Standard basis</label>
        <label class="fld chk"><input type="checkbox" id="chkGrid" checked> Grid</label>
      </div>
      <div id="latticeTools" hidden>
        <div class="vecrow" id="vecRow"></div>
        <button class="filebox" id="resetUV">Reset</button>
      </div>
    </div>
  </section>

  <!-- ============ the two planes ============ -->
  <section class="views">
    <div class="view">
      <div class="viewhead">
        <p class="card-title" id="domTitle">Domain</p>
        <span class="zoom"><button class="filebox" data-view="d" data-dir="1" title="Zoom out" aria-label="Zoom out domain">&minus;</button><button class="filebox" data-view="d" data-dir="-1" title="Zoom in" aria-label="Zoom in domain">+</button></span>
      </div>
      <svg id="svgDom" class="plane" viewBox="0 0 400 400" role="img" aria-label="Domain"></svg>
      <p class="hint" style="margin:.35rem 0 0">Drag to pan, scroll to zoom, double-click to reset. In 3D, dragging rotates the view.</p>
    </div>
    <div class="view">
      <div class="viewhead">
        <p class="card-title" id="codTitle">Codomain</p>
        <span class="zoom"><button class="filebox" data-view="c" data-dir="1" title="Zoom out" aria-label="Zoom out codomain">&minus;</button><button class="filebox" data-view="c" data-dir="-1" title="Zoom in" aria-label="Zoom in codomain">+</button></span>
      </div>
      <svg id="svgCod" class="plane" viewBox="0 0 400 400" role="img" aria-label="Codomain"></svg>
    </div>
  </section>

  <footer class="doc">
    <a href="https://github.com/tghyde/linearmaps">Linear Map Visualizer</a>
  </footer>
</main>

<script>
"use strict";
(function () {
var $ = function (id) { return document.getElementById(id); };
var SVGNS = "http://www.w3.org/2000/svg";
var VB = 400;                    /* viewBox is VB x VB pixels */
var DEG = Math.PI / 180;
var WMIN = 0.5, WMAX = 60;       /* zoom range (half-width of the window) */

/* ===================== entry expressions =====================
 * Entries are tiny arithmetic expressions: numbers, fractions, decimals,
 * pi, sqrt(...), + - * / and parentheses, with juxtaposition meaning
 * multiplication (2pi, 3sqrt(2)).  Each parses to an AST that gives both
 * a floating-point value (for the pictures) and LaTeX (for the display),
 * so a rotation matrix shows \frac{\sqrt{3}}{2} rather than 0.866.
 */
function tokenize(s) {
  var toks = [], i = 0, j;
  while (i < s.length) {
    var ch = s[i];
    if (/\s/.test(ch)) { i++; continue; }
    if (/[0-9.]/.test(ch)) {
      j = i; while (j < s.length && /[0-9.]/.test(s[j])) j++;
      var t = s.slice(i, j);
      if (!/^(\d+\.?\d*|\.\d+)$/.test(t)) return null;
      toks.push({ t: "num", v: t }); i = j; continue;
    }
    if (/[a-zA-Z]/.test(ch)) {
      j = i; while (j < s.length && /[a-zA-Z]/.test(s[j])) j++;
      toks.push({ t: "id", v: s.slice(i, j).toLowerCase() }); i = j; continue;
    }
    if ("+-*/()".indexOf(ch) >= 0) { toks.push({ t: ch }); i++; continue; }
    if (ch === "√") { toks.push({ t: "id", v: "sqrt" }); i++; continue; }
    if (ch === "π") { toks.push({ t: "id", v: "pi" }); i++; continue; }
    if (ch === "−") { toks.push({ t: "-" }); i++; continue; }
    if (ch === "×" || ch === "·") { toks.push({ t: "*" }); i++; continue; }
    return null;
  }
  return toks;
}
function parseExpr(s) {
  if (typeof s !== "string") return null;
  var toks = tokenize(s);
  if (!toks || !toks.length) return null;
  var p = 0;
  function peek() { return toks[p]; }
  function expr() {
    var a = term(); if (!a) return null;
    while (peek() && (peek().t === "+" || peek().t === "-")) {
      var op = toks[p++].t, b = term(); if (!b) return null;
      a = { k: op === "+" ? "add" : "sub", a: a, b: b };
    }
    return a;
  }
  function term() {
    var a = unary(); if (!a) return null;
    for (;;) {
      var nx = peek(), b;
      if (nx && (nx.t === "*" || nx.t === "/")) {
        p++; b = unary(); if (!b) return null;
        a = { k: nx.t === "*" ? "mul" : "div", a: a, b: b };
      } else if (nx && (nx.t === "id" || nx.t === "(")) {
        b = primary(); if (!b) return null;
        a = { k: "mul", a: a, b: b, implicit: true };
      } else break;
    }
    return a;
  }
  function unary() {
    var nx = peek();
    if (nx && nx.t === "-") { p++; var a = unary(); return a ? { k: "neg", a: a } : null; }
    if (nx && nx.t === "+") { p++; return unary(); }
    return primary();
  }
  function paren() {
    if (!peek() || peek().t !== "(") return null;
    p++;
    var e = expr();
    if (!e || !peek() || peek().t !== ")") return null;
    p++;
    return e;
  }
  function primary() {
    var nx = peek(); if (!nx) return null;
    if (nx.t === "num") { p++; return { k: "num", v: nx.v }; }
    if (nx.t === "(") { var e = paren(); return e ? { k: "par", a: e } : null; }
    if (nx.t === "id") {
      p++;
      if (nx.v === "pi") return { k: "pi" };
      if (nx.v === "sqrt") {
        var nn = peek();
        if (nn && nn.t === "(") { var e2 = paren(); return e2 ? { k: "sqrt", a: e2 } : null; }
        if (nn && nn.t === "num") { p++; return { k: "sqrt", a: { k: "num", v: nn.v } }; }
        return null;
      }
      return null;
    }

    state.entries = zeroEntries(m, n);
    if (Array.isArray(o.e)) for (var r = 0; r < m; r++) for (var j = 0; j < n; j++)
      if (o.e[r] && typeof o.e[r][j] === "string") state.entries[r][j] = o.e[r][j];
    if (o.v === 1 && o.uv && o.uv.length === 2) {
      ["u", "v"].forEach(function (k, i) {
        var w = o.uv[i];
        if (Array.isArray(w) && w.length === 2 && isFinite(w[0]) && isFinite(w[1])) state.vec[k] = [fmt(Number(w[0])), fmt(Number(w[1])), state.vec[k][2]];
      });
    }
    if (o.v === 2 && Array.isArray(o.vec)) {
      ["u", "v", "w"].forEach(function (k, i) {
        var w = o.vec[i];
        if (Array.isArray(w) && w.length === 3 && w.every(function (x) { return typeof x === "string" && parseEntry(x); })) state.vec[k] = w.slice();
      });
    }
    if (Array.isArray(o.f) && o.f.length === 2 && isFinite(o.f[0]) && isFinite(o.f[1])) state.fo = [Number(o.f[0]), Number(o.f[1])];
    if (Array.isArray(o.s) && o.s.length === 5) {
      ["figure", "circle", "lattice", "basis", "grid"].forEach(function (k, i) { state.show[k] = !!o.s[i]; });
    }
    if (Array.isArray(o.w)) {
      if (isFinite(o.w[0])) state.Wd = clampW(Number(o.w[0]));
      if (isFinite(o.w[1])) state.Wc = clampW(Number(o.w[1]));
    }
    if (Array.isArray(o.pan) && o.pan.length === 2) {
      ["d", "c"].forEach(function (k, i) {
        var q = o.pan[i];
        if (Array.isArray(q) && q.length === 2 && isFinite(q[0]) && isFinite(q[1])) state.pan[k] = [Number(q[0]), Number(q[1])];
      });
    }
    if (Array.isArray(o.cam) && isFinite(o.cam[0]) && isFinite(o.cam[1])) {
      state.cam = { yaw: Number(o.cam[0]), phi: Math.max(-1.55, Math.min(1.55, Number(o.cam[1]))) };
    }
    return { mapped: o.p === 1 };
  } catch (e) { return false; }
}

/* ===================== wiring ===================== */
function init() {
  /* theme toggle (matches hwGenie course pages; shares the hwg-theme key) */
  var tbtn = $("themetoggle");
  function effective() {
    var a = document.documentElement.getAttribute("data-theme");
    if (a) return a;
    return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function icon() { tbtn.textContent = effective() === "dark" ? "☀" : "☾"; }
  tbtn.addEventListener("click", function () {
    var next = effective() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("hwg-theme", next); } catch (e) {}
    icon(); themeCols = null; drawAll();
  });
  if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () { icon(); themeCols = null; drawAll(); });
  icon();

  /* dimensions */
  function dimChange() { setDims(Number($("selM").value), Number($("selN").value)); updateHash(); }
  $("selM").addEventListener("change", dimChange);
  $("selN").addEventListener("change", dimChange);

  /* matrix buttons; clicking the typeset matrix reopens the editor */
  $("mapBtn").addEventListener("click", doMap);
  $("editBtn").addEventListener("click", doEdit);
  $("matTex").addEventListener("click", doEdit);
  $("clearBtn").addEventListener("click", function () {
    setEntries(zeroEntries(state.m, state.n));
    $("editMsg").textContent = "";
    var first = document.querySelector("#grid input.cell");
    if (first) first.focus();
    updateHash();
  });
  $("copyLink").addEventListener("click", function () {
    updateHash();
    var url = window.location.href, msg = $("editMsg");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { msg.textContent = "Link copied."; },
                                              function () { msg.textContent = "Copy the link from the address bar."; });
    } else msg.textContent = "Copy the link from the address bar.";
    setTimeout(function () { if (msg.textContent.indexOf("Link") === 0) msg.textContent = ""; }, 2500);
  });
  document.querySelectorAll("[data-preset]").forEach(function (b) {
    b.addEventListener("click", function () { preset(this.dataset.preset); });
  });

  /* options */
  [["chkFigure", "figure"], ["chkCircle", "circle"], ["chkLattice", "lattice"], ["chkBasis", "basis"], ["chkGrid", "grid"]].forEach(function (pair) {
    var box = $(pair[0]);
    box.addEventListener("change", function () { state.show[pair[1]] = box.checked; drawAll(); updateHash(); });
  });
  $("resetUV").addEventListener("click", function () {
    state.vec = { u: VEC_DEFAULT.u.slice(), v: VEC_DEFAULT.v.slice(), w: VEC_DEFAULT.w.slice() };
    drawAll(); updateHash();
  });

  /* zoom buttons (the wheel zooms too) */
  document.querySelectorAll(".zoom button").forEach(function (b) {
    b.addEventListener("click", function () {
      var key = this.dataset.view === "d" ? "Wd" : "Wc";
      state[key] = clampW(state[key] * (Number(this.dataset.dir) > 0 ? 1.25 : 0.8));
      drawAll(); updateHash();
    });
  });

  setupPointer();

  /* restore a shared link, or start fresh */
  var loaded = loadHash();
  var E = state.entries;
  setDims(state.m, state.n);
  state.entries = E; buildGrid();
  ["chkFigure", "chkCircle", "chkLattice", "chkBasis", "chkGrid"].forEach(function (id, i) {
    $(id).checked = state.show[["figure", "circle", "lattice", "basis", "grid"][i]];
  });
  if (loaded && loaded.mapped) doMap(); else drawAll();
}
document.addEventListener("DOMContentLoaded", init);
})();
</script>
